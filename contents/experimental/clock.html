<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experimental Clock</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #23262b;
      --line: #d6d9de;
      --panel: #f5f7fa;
      --button: #eceff3;
      --button-hover: #e2e7ec;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1d1d1d;
        --text: #e8e8e8;
        --line: #3b3b3b;
        --panel: #262626;
        --button: #2f2f2f;
        --button-hover: #393939;
      }
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 22px;
      background: var(--bg);
      color: var(--text);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }

    p {
      margin: 0 0 16px;
      color: var(--text);
    }

    .clock-wrap {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      padding: 18px;
      display: grid;
      gap: 12px;
      max-width: 480px;
    }

    #clock {
      font-size: 2.1rem;
      letter-spacing: 0.03em;
      font-weight: 700;
      line-height: 1.1;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      border: 1px solid var(--line);
      background: var(--button);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 11px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }

    button:hover {
      background: var(--button-hover);
    }

    #timezone {
      font-size: 0.86rem;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <h1>Experimental Clock</h1>
  <p>This is a custom HTML post (non-markdown) with interactive UI.</p>

  <section class="clock-wrap">
    <div id="clock" aria-live="polite">--:--:--</div>
    <div id="timezone"></div>
    <div class="row">
      <button id="formatToggle" type="button">Use 12-hour time</button>
    </div>
  </section>

  <script>
    let use24Hour = true;
    const clock = document.getElementById("clock");
    const timezone = document.getElementById("timezone");
    const formatToggle = document.getElementById("formatToggle");

    function renderClock() {
      const now = new Date();
      clock.textContent = new Intl.DateTimeFormat([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: !use24Hour
      }).format(now);

      timezone.textContent = new Intl.DateTimeFormat([], {
        weekday: "short",
        year: "numeric",
        month: "short",
        day: "2-digit",
        timeZoneName: "short"
      }).format(now);
    }

    formatToggle.addEventListener("click", () => {
      use24Hour = !use24Hour;
      formatToggle.textContent = use24Hour ? "Use 12-hour time" : "Use 24-hour time";
      renderClock();
    });

    renderClock();
    setInterval(renderClock, 1000);
  </script>
</body>
</html>
