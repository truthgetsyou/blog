<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jay's blog</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Blog sidebar">
      <section id="treeSection" class="sidebar-section">
        <div id="fileTree" class="scroll-region" aria-label="Notes tree"></div>
      </section>

      <div id="sectionResizer" aria-hidden="true"></div>

      <section id="outlineSection" class="sidebar-section">
        <div id="outline" class="scroll-region" aria-label="Current note outline"></div>
      </section>

      <div id="sidebarResizer" aria-hidden="true"></div>
    </aside>

    <main id="mainContent">
      <article id="noteContent" aria-live="polite"></article>
    </main>
  </div>

  <div id="buttonBar" role="group" aria-label="Sidebar, theme, and navigation controls">
    <button
      id="sidebarToggle"
      type="button"
      aria-controls="sidebar"
      aria-expanded="true"
      aria-label="Hide sidebar"
      title="Hide sidebar"
    >
      <i class="bi bi-layout-sidebar-inset" aria-hidden="true"></i>
    </button>
    <button
      id="themeToggle"
      type="button"
      aria-label="Switch to dark mode"
      title="Switch to dark mode"
    >
      <i class="bi bi-moon-stars" aria-hidden="true"></i>
    </button>
    <button
      id="navHome"
      type="button"
      aria-label="Go to welcome note"
      title="Go to welcome note"
    >
      <i class="bi bi-house" aria-hidden="true"></i>
    </button>
    <button
      id="navBack"
      type="button"
      aria-label="Go back"
      title="Go back"
    >
      <i class="bi bi-arrow-left" aria-hidden="true"></i>
    </button>
    <button
      id="navForward"
      type="button"
      aria-label="Go forward"
      title="Go forward"
    >
      <i class="bi bi-arrow-right" aria-hidden="true"></i>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
